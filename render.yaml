services:
  - type: web
    name: onelink-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @repo/prisma build && pnpm --filter @repo/shared build && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID_CREATOR_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_CREATOR_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_ENTERPRISE_YEARLY
        sync: false
